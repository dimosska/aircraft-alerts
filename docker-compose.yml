name: aircraft-alerts

services:
  weather:
    build:
      context: .
      target: production
    restart: unless-stopped
    command:
      - node
      - src/weather-server.js
    environment:
      WEATHER_STATION_ID: ${WEATHER_STATION_ID:-PME193}
      WEATHER_STATION_NAME: ${WEATHER_STATION_NAME:-Węgrzce}
      WEATHER_API_BASE_URL: ${WEATHER_API_BASE_URL:-https://edwin-meteo.apps.paas.psnc.pl}
      WEATHER_POLL_INTERVAL_SECONDS: ${WEATHER_POLL_INTERVAL_SECONDS:-60}
      WEATHER_STALE_AFTER_SECONDS: ${WEATHER_STALE_AFTER_SECONDS:-600}
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  predictor:
    build:
      context: .
      target: production
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8080"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.40.5
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      TZ: ${TZ:-Europe/Warsaw}
      GENERIC_TIMEZONE: ${TZ:-Europe/Warsaw}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    depends_on:
      predictor:
        condition: service_healthy

  redis:
    image: redis:8.10.2-alpine3.23
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # The official Redis entrypoint needs these only to initialize /data
      # ownership and then drop from root to the redis user.
      - CHOWN
      - SETGID
      - SETUID

volumes:
  n8n_data:
  redis_data:
